name: Release

run-name: "Release ${{ github.ref_name }}"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Cargo.toml version matches tag
        run: |
          set -euo pipefail
          CARGO_VER=$(awk -F\" '/^version[[:space:]]*=/ {print $2; exit}' Cargo.toml)
          TAG="${{ github.ref_name }}"
          if [ "v$CARGO_VER" != "$TAG" ]; then
            echo "::error::Cargo.toml version $CARGO_VER does not match tag $TAG (expected v$CARGO_VER)"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag

  build:
    name: Build ${{ matrix.target }}
    needs: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write       # sigstore attestation
      attestations: write   # GitHub artifact attestations
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          # Rust 1.95 predates v2's Cargo 1.97+ build-warnings support.
          rustflags: "-D warnings"
          # Host build scripts must not leak between native and cross images.
          cache-key: release-${{ matrix.target }}-v1

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      # Keep target and feature flags in sync with the binary build below.
      - name: Generate license notices
        run: python scripts/generate-licenses.py --target ${{ matrix.target }}

      # Build + archive + checksum locally (dry-run skips upload so files
      # remain in the workspace for attestation).
      - name: Build static binary
        id: build
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ethryx
          target: ${{ matrix.target }}
          locked: true
          archive: ethryx-$tag-$target
          include: >-
            LICENSE,LICENSE-MIT,LICENSE-APACHE,
            target/release-licenses/THIRD_PARTY_LICENSES.txt,
            target/release-licenses/RUST_LIBRARY_LICENSES.html
          checksum: sha256
          dry-run: true

      - name: Verify archive license notices
        run: >-
          python scripts/check-release-archive.py
          --archive "${{ steps.build.outputs.archive }}"
          --target ${{ matrix.target }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ steps.build.outputs.archive }}.tar.gz
            ${{ steps.build.outputs.archive }}.zip

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" "${{ steps.build.outputs.archive }}".*
