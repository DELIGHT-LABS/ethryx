name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

# Prevent duplicate runs: PR updates cancel the previous run for the same PR,
# and push-to-main gets its own concurrency group.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Default to least privilege; jobs opt-in to more if needed.
permissions:
  contents: read

jobs:
  build:
    name: Build & test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    env:
      # Integration tests release selected TCP ports before proxy startup.
      RUST_TEST_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          # Rust 1.95 predates v2's Cargo 1.97+ build-warnings support.
          rustflags: "-D warnings"
          components: rustfmt, clippy

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: cargo clippy (all features)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: cargo test (all features)
        run: cargo test --all-features --locked

      - name: Seeded JSON differential stress
        run: >-
          cargo test --locked --lib rpc::tests::prefilter_seeded_stress_matches_full_parser
          -- --ignored --exact

      - name: WebSocket connection churn
        env:
          ETHRYX_STRESS_SECONDS: "5"
        run: >-
          cargo test --locked --test integration
          websocket_sustained_churn_preserves_replies_and_releases_upstreams
          -- --ignored --exact --nocapture

      - name: Release archive verifier tests
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit -D warnings

  deny:
    name: Supply-chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: "-D warnings"

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny --all-features check

  release-artifacts:
    name: Release archives (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: "-D warnings"
          # Host build scripts must not leak between native and cross images.
          cache-key: release-${{ matrix.target }}-v1

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - name: Generate default-feature notices
        run: python scripts/generate-licenses.py --target ${{ matrix.target }}

      - name: Build default-feature archive
        id: default-build
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ethryx
          target: ${{ matrix.target }}
          locked: true
          archive: ethryx-ci-$target-default
          include: >-
            LICENSE,LICENSE-MIT,LICENSE-APACHE,
            target/release-licenses/THIRD_PARTY_LICENSES.txt,
            target/release-licenses/RUST_LIBRARY_LICENSES.html
          checksum: sha256
          dry-run: true

      - name: Verify default-feature archive
        run: >-
          python scripts/check-release-archive.py
          --archive "${{ steps.default-build.outputs.archive }}"
          --target ${{ matrix.target }}

      - name: Generate all-feature notices
        run: >-
          python scripts/generate-licenses.py --target ${{ matrix.target }}
          --all-features --output-dir target/all-feature-licenses

      - name: Build all-feature archive
        id: all-build
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ethryx
          target: ${{ matrix.target }}
          locked: true
          all-features: true
          archive: ethryx-ci-$target-all
          include: >-
            LICENSE,LICENSE-MIT,LICENSE-APACHE,
            target/all-feature-licenses/THIRD_PARTY_LICENSES.txt,
            target/all-feature-licenses/RUST_LIBRARY_LICENSES.html
          checksum: sha256
          dry-run: true

      - name: Verify all-feature archive
        run: >-
          python scripts/check-release-archive.py
          --archive "${{ steps.all-build.outputs.archive }}"
          --target ${{ matrix.target }}
          --licenses-dir target/all-feature-licenses

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      # Coverage runs the same integration tests as the build jobs.
      RUST_TEST_THREADS: "1"
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rustflags: "-D warnings"
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Coverage summary
        run: cargo llvm-cov --locked --summary-only
