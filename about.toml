# Keep this list aligned with deny.toml. Order selects a license when an
# upstream offers alternatives; AND expressions still require every license.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

# Development dependencies are not distributed. Retain build dependencies:
# generators can incorporate their own code into the resulting binary.
ignore-dev-dependencies = true
